name: CI

on:
  push:
    # Feature and fix branches run the full suite before they ever open a PR.
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    # Filters on the branch a PR targets, not the one it comes from, so the
    # feature/fix globs above have no meaning here - everything merges to main.
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    name: Syntax, versions and checksums
    # macOS runner: the scripts rely on zsh, plutil, shasum and BSD sed
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Parse every script with zsh
        run: |
          set -e
          for script in setup_mac.sh uninstall.sh update_system.1h.sh lib/*.sh tools/*.sh; do
            echo "==> $script"
            zsh -n "$script"
          done

      - name: Version strings match VERSION
        run: ./tools/sync_version.sh --check

      - name: SHA256SUMS matches the distributed scripts
        # Self-update refuses to install anything not listed here, so a stale
        # SHA256SUMS would silently freeze every installation.
        run: ./tools/generate_checksums.sh --check

      - name: Engine starts against an empty HOME
        # The SwiftBar menu render this step used to check is gone, and with
        # it the no-argument default: the engine now prints its usage banner
        # and exits 2. Running that against an empty HOME still proves what
        # the old step was for - every lib/*.sh sources cleanly, the engine
        # creates its own state folder, and it neither hangs nor needs the
        # network to get that far. MSU_LIB_DIR points the engine at this
        # checkout's lib/ directly, the same way the bats suite does.
        run: |
          export HOME="$RUNNER_TEMP/fakehome"
          export MSU_LIB_DIR="$PWD/lib"
          mkdir -p "$HOME"
          # brew exists on the runner, so the pre-flight check passes
          status=0
          output=$(./update_system.1h.sh 2>&1 < /dev/null) || status=$?
          echo "$output" | head -20
          [ "$status" -eq 2 ] \
            || { echo "::error::expected the usage banner (exit 2), got exit $status"; exit 1; }
          echo "$output" | grep -q "Usage:" \
            || { echo "::error::engine did not print its usage banner"; exit 1; }
          [ -d "$HOME/Library/Application Support/MacSoftwareUpdater/cache" ] \
            || { echo "::error::engine did not create its state folder"; exit 1; }

      - name: Install bats-core
        run: brew install bats-core

      - name: Shell function tests (bats)
        # Tests source the script from a zsh subprocess (see the
        # $ZSH_EVAL_CONTEXT guard at the top of section 5 in
        # update_system.1h.sh) to load its functions without triggering a
        # real run - never a bash 'source' of a zsh-syntax file.
        run: bats tests/

  swift-tests:
    name: Swift unit tests (GuideApp)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: swift test
        run: swift test --package-path GuideApp

  shellcheck:
    name: shellcheck (advisory)
    runs-on: ubuntu-latest
    # shellcheck has no zsh mode. Running it as bash surfaces genuine quoting
    # problems but also flags zsh-only syntax, so this job never blocks.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck as bash
        run: |
          shellcheck --shell=bash --severity=warning \
            setup_mac.sh uninstall.sh update_system.1h.sh lib/*.sh tools/*.sh || true

  swiftlint:
    name: SwiftLint
    runs-on: macos-latest
    # Blocks on errors only. The thresholds in .swiftlint.yml draw the line:
    # a line over 200 characters or a type body over 400 lines fails the job,
    # while the warning tier (150 / 300, file_length, identifier_name and the
    # rest) is reported and passes. There are 30 such warnings outstanding and
    # no --strict, so they do not gate a merge - but the error count is at zero
    # and stays there.

    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --config .swiftlint.yml GuideApp
