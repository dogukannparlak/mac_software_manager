included:
  - GuideApp/Sources
  - GuideApp/Tests

excluded:
  - GuideApp/.build

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - fatal_error_message
  - first_where
  - redundant_nil_coalescing
  - sorted_imports
  - unneeded_parentheses_in_closure_argument

line_length:
  warning: 150
  error: 200

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 500
  error: 800

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
